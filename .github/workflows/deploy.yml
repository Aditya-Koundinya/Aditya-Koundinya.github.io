# Builds with Vite → publishes to gh-pages (recommended Pages branch).
# Also copies profile/resume to repo root on main so assets work if Pages still uses main.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish built site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Copy resume and photo to repo root (main branch Pages fallback)
        run: cp public/profile.png public/resume.pdf .

      - name: Commit root assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile.png resume.pdf
          git diff --staged --quiet || git commit -m "chore: sync profile and resume to site root"
          git push
